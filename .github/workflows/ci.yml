name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ['fedora:43', 'fedora:44', 'fedora:45', 'ubuntu:26.04']
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          if command -v dnf >/dev/null; then
            dnf install -y nodejs npm gnome-shell zip make git
          else
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              nodejs npm gnome-shell zip unzip make git ca-certificates
          fi
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Check that the committed dist/ matches the source
        run: cp -r dist /tmp/dist-committed && npm run build && diff -r /tmp/dist-committed dist
      - name: Check the install script
        run: bash -n install.sh
      - run: make pack
      - name: Inspect release contents
        run: unzip -l build/releases/zonecraft@jmonjardino.dev.shell-extension.zip
