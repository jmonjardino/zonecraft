name: Bug report
description: Report reproducible Zonecraft behavior
body:
  - type: input
    id: version
    attributes:
      label: Zonecraft version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Fedora, GNOME Shell, and session versions
      placeholder: Fedora 44, GNOME 50, Wayland
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and relevant logs
    validations:
      required: true
